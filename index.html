<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Manish Chavan" />

    <!--
      All three are generated from public/hacker.png by
      scripts/generate-assets.mjs. 32px is the size a browser tab actually
      draws; the 180 is there for higher-density displays and pinned tabs.
    -->
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-180.png" sizes="180x180" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- The page background, so the browser chrome blends in. Light only. -->
    <meta name="theme-color" content="#ffffff" />

    <!--
      The one font file the first screen cannot render without. Preloading it
      lets the headline paint in Geist instead of swapping in a beat later.
      Vite rewrites this path to the same hashed file the stylesheet uses.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2"
      crossorigin
    />

    <meta property="og:locale" content="en" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Everything between the seo markers is regenerated per route by
      scripts/prerender.mjs from src/data/seo.ts. What sits here is the home
      page's copy: it is what `vite dev` serves and what a build would fall
      back to, so it should stay in step with metaForPath("/").
      Do not hand-edit one without the other, and do not move the markers.
    -->
    <!--seo:start-->
    <title>Manish Chavan — Full-stack Software Engineer</title>
    <meta
      name="description"
      content="Master's student in Web and Data Science and working student in Berlin, with three years building production web systems in React, Node.js and PostgreSQL."
    />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1"
    />
    <link rel="canonical" href="https://manishchavan.in/" />
    <meta
      property="og:title"
      content="Manish Chavan — Full-stack Software Engineer"
    />
    <meta
      property="og:description"
      content="Master's student in Web and Data Science and working student in Berlin, with three years building production web systems in React, Node.js and PostgreSQL."
    />
    <meta property="og:type" content="profile" />
    <meta property="og:url" content="https://manishchavan.in/" />
    <meta property="og:site_name" content="Manish Chavan" />
    <meta property="og:image" content="https://manishchavan.in/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Manish Chavan, Full-stack Software Engineer"
    />
    <meta
      name="twitter:title"
      content="Manish Chavan — Full-stack Software Engineer"
    />
    <meta
      name="twitter:description"
      content="Master's student in Web and Data Science and working student in Berlin, with three years building production web systems in React, Node.js and PostgreSQL."
    />
    <meta name="twitter:image" content="https://manishchavan.in/og.png" />
    <!--seo:end-->

    <!--
      Arms the scroll-reveal styles in index.css before first paint, so
      below-the-fold sections never flash in and then hide.

      Skipped entirely when:
        - the reader prefers reduced motion;
        - the browser lacks IntersectionObserver;
        - the page is being reloaded or returned to with back/forward. The
          browser is about to restore the scroll position against the page as
          laid out, and elements still shifted down waiting to be revealed
          would throw that off by the shift distance. A returning reader has
          also seen the entrance once already.

      And undone after a timeout if the bundle never boots, so content can
      never be left invisible.
    -->
    <script>
      (function () {
        try {
          var d = document.documentElement;
          if (!("IntersectionObserver" in window)) return;
          if (window.matchMedia("(prefers-reduced-motion: reduce)").matches)
            return;
          var nav =
            performance.getEntriesByType &&
            performance.getEntriesByType("navigation")[0];
          if (nav && (nav.type === "reload" || nav.type === "back_forward"))
            return;
          d.classList.add("reveal-on");
          setTimeout(function () {
            if (!window.__appBooted) d.classList.remove("reveal-on");
          }, 4000);
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
